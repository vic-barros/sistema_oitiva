<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Polícia Civil - Cadastrar Funcionário</title>
    <style>
        :root {
            --primary-color: #1a1a1a;
            --secondary-color: #1e3a5f;
            --accent-color: #c9a961;
            --accent-hover: #b08d3f;
            --bg-color: #f4f2ed;
            --card-bg: #ffffff;
            --text-color: #2d2d2d;
            --border-color: #d8d3c8;
            --font-display: 'Oswald', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-body);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-bottom: 3px solid var(--accent-color);
        }

        header .title {
            font-size: 1.15rem;
            font-family: var(--font-display);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-brasao {
            width: 38px;
            height: auto;
        }

        header .user-badge {
            background: var(--secondary-color);
            padding: 8px 15px;
            border-radius: 2px;
            font-size: 0.9rem;
            border: 1px solid #4a5568;
        }

        header button {
            background: #e53e3e;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 2px;
            cursor: pointer;
            margin-left: 15px;
            font-size: 0.85rem;
        }

        header button:hover { background: #c53030; }

        header button.btn-voltar {
            background: var(--secondary-color);
            border: 1px solid #4a5568;
        }

        header button.btn-voltar:hover { background: #4a5568; }

        .main-container {
            padding: 30px;
            max-width: 700px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        .card {
            background: var(--card-bg);
            border-radius: 3px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }

        .card h3 {
            margin-bottom: 20px;
            font-size: 1.1rem;
            color: var(--primary-color);
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 10px;
        }

        .form-group { margin-bottom: 15px; }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a5568;
            text-transform: uppercase;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 3px;
            background-color: #fff;
            color: var(--text-color);
            font-size: 0.95rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(49,130,206,0.15);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            font-size: 0.85rem;
            color: #4a5568;
            cursor: pointer;
        }

        .checkbox-group input { width: auto; cursor: pointer; }

        button.btn-primary {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 3px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        button.btn-primary:hover { background-color: var(--accent-hover); }

        #customToast {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--secondary-color);
            color: white;
            padding: 15px 25px;
            border-radius: 3px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 10000;
            font-weight: bold;
            font-size: 0.95rem;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="customToast">Mensagem aqui</div>

    <header>
        <div class="header-brand">
            <img src="../assets/brasao_pcse.png" alt="Brasão Polícia Civil de Sergipe" class="header-brasao">
            <div class="title">POLÍCIA CIVIL - CADASTRAR FUNCIONÁRIO</div>
        </div>
        <div>
            <span class="user-badge">
                Bem-vindo(a), <strong id="lblUsuario">Nome</strong>
            </span>
            <button class="btn-voltar" onclick="voltarModulos()">Módulos</button>
            <button onclick="efetuarLogout()">Sair</button>
        </div>
    </header>

    <div class="main-container">
        <div class="card">
            <h3>Novo Funcionário da Delegacia</h3>

            <form id="formFuncionario" onsubmit="cadastrarFuncionario(event)">

                <div class="form-group">
                    <label>Nome:</label>
                    <input type="text" id="funcNome" required placeholder="Nome completo do servidor">
                </div>

                <div class="form-group">
                    <label>CPF:</label>
                    <input type="text" id="funcCpf" required placeholder="Ex: 000.000.000-00">
                </div>

                <div class="form-group">
                    <label>Login:</label>
                    <input type="text" id="funcLogin" required placeholder="Defina o usuário de login">
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label>Senha:</label>
                    <input type="password" id="funcSenha" required placeholder="Defina a senha inicial">
                    <label class="checkbox-group">
                        <input type="checkbox" onchange="toggleMostrarSenha()"> Mostrar senha
                    </label>
                </div>

                <div class="form-group">
                    <label>Cargo:</label>
                    <select id="funcCargo">
                        <option value="POLICIAL">POLICIAL</option>
                        <option value="ESTAGIARIO">ESTAGIÁRIO</option>
                    </select>
                </div>

                <p style="font-size: 0.85rem; color: #718096; margin-bottom: 15px;">
                    O cadastro nasce com status <strong>PENDENTE</strong> e só poderá fazer login após aprovação de um administrador.
                </p>

                <button type="submit" class="btn-primary">Cadastrar Funcionário</button>
            </form>
        </div>
    </div>

    <script>
        const API = 'http://localhost:8080';
        let usuarioLogado = null;

        // ── SESSÃO E GUARDA DE ACESSO (só POLICIAL) ───────────
        (function carregarSessao() {
            const salvo = sessionStorage.getItem('usuarioLogado');
            if (!salvo) {
                window.location.href = '../index.html';
                return;
            }
            usuarioLogado = JSON.parse(salvo);

            if (usuarioLogado.cargo !== 'POLICIAL') {
                window.location.href = '../index.html';
                return;
            }

            document.getElementById('lblUsuario').innerText = usuarioLogado.nome;
        })();

        function voltarModulos() { window.location.href = '../index.html'; }

        function efetuarLogout() {
            sessionStorage.removeItem('usuarioLogado');
            window.location.href = '../index.html';
        }

        function toggleMostrarSenha() {
            const input = document.getElementById('funcSenha');
            input.type = input.type === "password" ? "text" : "password";
        }

        function exibirNotificacao(mensagem, tipo = "success") {
            const toast = document.getElementById('customToast');
            toast.innerText = mensagem;
            toast.style.backgroundColor = tipo === "error" ? "#e53e3e" : "#1e3a5f";
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 4000);
        }

        // ── CADASTRAR FUNCIONÁRIO ──────────────────────────────
        async function cadastrarFuncionario(event) {
            event.preventDefault();

            const corpo = {
                nome:   document.getElementById('funcNome').value.trim(),
                cpf:    document.getElementById('funcCpf').value.trim(),
                login:  document.getElementById('funcLogin').value.trim(),
                senha:  document.getElementById('funcSenha').value,
                cargo:  document.getElementById('funcCargo').value
            };

            try {
                const resp = await fetch(`${API}/funcionarios`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(corpo)
                });
                const dados = await resp.json();
                if (dados.sucesso) {
                    document.getElementById('formFuncionario').reset();
                    exibirNotificacao("Funcionário " + corpo.nome + " cadastrado com sucesso! Aguardando aprovação do admin.");
                } else {
                    exibirNotificacao("Erro: " + (dados.erro || "verifique os dados."), "error");
                }
            } catch (e) {
                exibirNotificacao("Erro ao conectar com o servidor.", "error");
            }
        }
    </script>
</body>
</html>
