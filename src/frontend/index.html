<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polícia Civil - Sistema Integrado</title>
    <style>
        :root {
            --primary-color: #1a202c;
            --secondary-color: #2d3748;
            --accent-color: #3182ce;
            --accent-hover: #2b6cb0;
            --bg-color: #edf2f7;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --border-color: #cbd5e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Tela de Login */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 400px;
            border-top: 5px solid var(--primary-color);
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        .login-card h5 {
            text-align: center;
            color: #718096;
            margin-bottom: 30px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a5568;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: #fff;
            color: var(--text-color);
            font-size: 0.95rem;
            transition: border 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(49,130,206,0.15);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            font-size: 0.85rem;
            color: #4a5568;
            cursor: pointer;
        }

        .checkbox-group input {
            width: auto;
            cursor: pointer;
        }

        button.btn-primary {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .error-message {
            color: #e53e3e;
            background: #fed7d7;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            display: none;
            text-align: center;
        }

        /* Tela de Seleção de Módulo */
        .modulos-screen {
            display: none;
            flex-direction: column;
            flex: 1;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header .title {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        header .user-badge {
            background: var(--secondary-color);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid #4a5568;
        }

        header button {
            background: #e53e3e;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 15px;
            font-size: 0.85rem;
        }

        header button:hover {
            background: #c53030;
        }

        .modulos-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .modulos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
            max-width: 900px;
            width: 100%;
        }

        .modulo-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 35px 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            border-top: 4px solid var(--accent-color);
            text-align: center;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .modulo-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .modulo-card.admin {
            border-top-color: #e53e3e;
        }

        .modulo-card .icone {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .modulo-card h3 {
            color: var(--primary-color);
            margin-bottom: 8px;
            font-size: 1.15rem;
        }

        .modulo-card p {
            color: #718096;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        /* Notificação Personalizada (Toast) */
        #customToast {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2b6cb0;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 10000;
            font-weight: bold;
            font-size: 0.95rem;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="customToast">Mensagem aqui</div>

    <!-- ── TELA DE LOGIN ─────────────────────────────────────── -->
    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <h2>POLÍCIA CIVIL</h2>
            <h5>Sistema Integrado da Delegacia</h5>

            <div class="error-message" id="loginError">Acesso negado! Login ou senha incorretos.</div>

            <div class="form-group">
                <label>Login</label>
                <input type="text" id="inputLogin" placeholder="Ex: admin" required>
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label>Senha</label>
                <input type="password" id="inputSenha" placeholder="••••••••" required>
                <label class="checkbox-group">
                    <input type="checkbox" onchange="toggleMostrarSenha()"> Mostrar senha
                </label>
            </div>
            <button class="btn-primary" onclick="executarLogin()">Acessar Sistema</button>
        </div>
    </div>

    <!-- ── TELA DE SELEÇÃO DE MÓDULO ─────────────────────────── -->
    <div class="modulos-screen" id="modulosScreen">
        <header>
            <div class="title">POLÍCIA CIVIL - PAINEL PRINCIPAL</div>
            <div>
                <span class="user-badge">
                    Bem-vindo(a), <strong id="lblUsuario">Nome</strong> | Cargo: <span id="lblCargo">Cargo</span>
                </span>
                <button onclick="efetuarLogout()">Sair</button>
            </div>
        </header>

        <div class="modulos-container">
            <div class="modulos-grid" id="gridModulos">
                <!-- cards montados via JS conforme cargo/isAdmin -->
            </div>
        </div>
    </div>

    <script>
        const API = 'http://localhost:8080';

        // ── UTILITÁRIOS ──────────────────────────────────────
        function toggleMostrarSenha() {
            const input = document.getElementById('inputSenha');
            input.type = input.type === "password" ? "text" : "password";
        }

        function exibirNotificacao(mensagem, tipo = "success") {
            const toast = document.getElementById('customToast');
            toast.innerText = mensagem;
            toast.style.backgroundColor = tipo === "error" ? "#e53e3e" : "#2b6cb0";
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        // ── LOGIN ────────────────────────────────────────────
        async function executarLogin() {
            const login = document.getElementById('inputLogin').value.trim();
            const senha = document.getElementById('inputSenha').value;
            const erroDiv = document.getElementById('loginError');
            erroDiv.style.display = 'none';

            try {
                const resp = await fetch(`${API}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, senha })
                });
                const dados = await resp.json();

                if (dados.sucesso) {
                    const usuarioLogado = {
                        idFuncionario: dados.idFuncionario,
                        nome: dados.nome,
                        cargo: dados.cargo,
                        login,
                        isAdmin: dados.isAdmin === true || dados.isAdmin === "true"
                    };
                    sessionStorage.setItem('usuarioLogado', JSON.stringify(usuarioLogado));

                    mostrarTelaModulos(usuarioLogado);
                    exibirNotificacao("Bem-vindo(a) ao sistema!");
                } else {
                    erroDiv.innerText = dados.erro || "Acesso negado! Login ou senha incorretos.";
                    erroDiv.style.display = 'block';
                }
            } catch (e) {
                erroDiv.innerText = 'Erro ao conectar com o servidor Java.';
                erroDiv.style.display = 'block';
            }
        }

        function efetuarLogout() {
            sessionStorage.removeItem('usuarioLogado');
            document.getElementById('modulosScreen').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('inputLogin').value = '';
            document.getElementById('inputSenha').value = '';
        }

        // ── SELEÇÃO DE MÓDULO ─────────────────────────────────
        function mostrarTelaModulos(usuarioLogado) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('modulosScreen').style.display = 'flex';
            document.getElementById('lblUsuario').innerText = usuarioLogado.nome;
            document.getElementById('lblCargo').innerText = usuarioLogado.cargo;

            const grid = document.getElementById('gridModulos');
            let cardsHtml = `
                <div class="modulo-card" onclick="irPara('oitivas/oitivas.html')">
                    <div class="icone">📋</div>
                    <h3>Agendamento de Oitivas</h3>
                    <p>Cadastrar, listar e acompanhar oitivas em andamento.</p>
                </div>
                <div class="modulo-card" onclick="irPara('documentos/documentos.html')">
                    <div class="icone">🗂️</div>
                    <h3>Controle Cartorário</h3>
                    <p>Registrar procedimentos, repassar e consultar posse.</p>
                </div>
            `;

            if (usuarioLogado.cargo === 'POLICIAL') {
                cardsHtml += `
                    <div class="modulo-card" onclick="irPara('funcionarios/funcionarios.html')">
                        <div class="icone">👥</div>
                        <h3>Cadastrar Funcionário</h3>
                        <p>Registrar novo servidor no sistema (aguarda aprovação do admin).</p>
                    </div>
                `;
            }

            if (usuarioLogado.isAdmin) {
                cardsHtml += `
                    <div class="modulo-card admin" onclick="irPara('admin/admin.html')">
                        <div class="icone">⚙️</div>
                        <h3>Administração</h3>
                        <p>Aprovar cadastros, recusar e resetar senhas.</p>
                    </div>
                `;
            }

            grid.innerHTML = cardsHtml;
        }

        function irPara(pagina) {
            window.location.href = pagina;
        }

        // ── RESTAURA SESSÃO AO CARREGAR A PÁGINA ─────────────
        (function restaurarSessao() {
            const salvo = sessionStorage.getItem('usuarioLogado');
            if (salvo) {
                mostrarTelaModulos(JSON.parse(salvo));
            }
        })();
    </script>
</body>
</html>
