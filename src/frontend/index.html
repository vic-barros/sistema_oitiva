<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polícia Civil - Sistema Integrado</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1a1a1a;
            --secondary-color: #1e3a5f;
            --accent-color: #c9a961;
            --accent-hover: #b08d3f;
            --bg-color: #f4f2ed;
            --card-bg: #ffffff;
            --text-color: #2d2d2d;
            --border-color: #d8d3c8;
            --font-display: 'Oswald', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-body);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Tela de Login */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 3px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 400px;
            border-top: 4px solid var(--accent-color);
        }

        .login-brasao {
            display: block;
            width: 92px;
            margin: 0 auto 18px;
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 10px;
            color: var(--primary-color);
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        .login-card h5 {
            text-align: center;
            color: #718096;
            margin-bottom: 30px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 0.75rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a5568;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 3px;
            background-color: #fff;
            color: var(--text-color);
            font-size: 0.95rem;
            transition: border 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(49,130,206,0.15);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            font-size: 0.85rem;
            color: #4a5568;
            cursor: pointer;
        }

        .checkbox-group input {
            width: auto;
            cursor: pointer;
        }

        button.btn-primary {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 3px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .error-message {
            color: #e53e3e;
            background: #fed7d7;
            padding: 10px;
            border-radius: 2px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            display: none;
            text-align: center;
        }

        /* Tela de Seleção de Módulo */
        .modulos-screen {
            display: none;
            flex-direction: column;
            flex: 1;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-bottom: 3px solid var(--accent-color);
        }

        header .title {
            font-size: 1.15rem;
            font-family: var(--font-display);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-brasao {
            width: 38px;
            height: auto;
        }

        header .user-badge {
            background: var(--secondary-color);
            padding: 8px 15px;
            border-radius: 2px;
            font-size: 0.9rem;
            border: 1px solid var(--accent-color);
        }

        header button {
            background: #e53e3e;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 2px;
            cursor: pointer;
            margin-left: 15px;
            font-size: 0.85rem;
        }

        header button:hover {
            background: #c53030;
        }

        .modulos-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .modulos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
            max-width: 900px;
            width: 100%;
        }

        .modulo-card {
            background: var(--card-bg);
            border-radius: 3px;
            padding: 35px 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            border-top: 4px solid var(--accent-color);
            text-align: center;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .modulo-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .modulo-card.admin {
            border-top-color: #e53e3e;
        }

        .modulo-card .icone {
            width: 52px;
            height: 52px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--accent-color);
            border-radius: 50%;
        }

        .modulo-card .icone svg {
            width: 24px;
            height: 24px;
            stroke: var(--primary-color);
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .modulo-card h3 {
            color: var(--primary-color);
            margin-bottom: 8px;
            font-size: 1.05rem;
            font-family: var(--font-display);
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .modulo-card p {
            color: #718096;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        /* Notificação Personalizada (Toast) */
        #customToast {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--secondary-color);
            color: white;
            padding: 15px 25px;
            border-radius: 3px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 10000;
            font-weight: bold;
            font-size: 0.95rem;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="customToast">Mensagem aqui</div>

    <!-- ── TELA DE LOGIN ─────────────────────────────────────── -->
    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <img src="assets/brasao_pcse.png" alt="Brasão Polícia Civil de Sergipe" class="login-brasao">
            <h2>POLÍCIA CIVIL</h2>
            <h5>Sistema Integrado da Delegacia</h5>

            <div class="error-message" id="loginError">Acesso negado! Login ou senha incorretos.</div>

            <div class="form-group">
                <label>Login</label>
                <input type="text" id="inputLogin" placeholder="Ex: admin" required>
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label>Senha</label>
                <input type="password" id="inputSenha" placeholder="••••••••" required>
                <label class="checkbox-group">
                    <input type="checkbox" onchange="toggleMostrarSenha()"> Mostrar senha
                </label>
            </div>
            <button class="btn-primary" onclick="executarLogin()">Acessar Sistema</button>
        </div>
    </div>

    <!-- ── TELA DE SELEÇÃO DE MÓDULO ─────────────────────────── -->
    <div class="modulos-screen" id="modulosScreen">
        <header>
            <div class="header-brand">
                <img src="assets/brasao_pcse.png" alt="Brasão Polícia Civil de Sergipe" class="header-brasao">
                <div class="title">POLÍCIA CIVIL - PAINEL PRINCIPAL</div>
            </div>
            <div>
                <span class="user-badge">
                    Bem-vindo(a), <strong id="lblUsuario">Nome</strong> | Cargo: <span id="lblCargo">Cargo</span>
                </span>
                <button onclick="efetuarLogout()">Sair</button>
            </div>
        </header>

        <div class="modulos-container">
            <div class="modulos-grid" id="gridModulos">
                <!-- cards montados via JS conforme cargo/isAdmin -->
            </div>
        </div>
    </div>

    <script>
        const API = 'http://localhost:8080';

        // ── UTILITÁRIOS ──────────────────────────────────────
        function toggleMostrarSenha() {
            const input = document.getElementById('inputSenha');
            input.type = input.type === "password" ? "text" : "password";
        }

        function exibirNotificacao(mensagem, tipo = "success") {
            const toast = document.getElementById('customToast');
            toast.innerText = mensagem;
            toast.style.backgroundColor = tipo === "error" ? "#e53e3e" : "#1e3a5f";
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        // ── LOGIN ────────────────────────────────────────────
        async function executarLogin() {
            const login = document.getElementById('inputLogin').value.trim();
            const senha = document.getElementById('inputSenha').value;
            const erroDiv = document.getElementById('loginError');
            erroDiv.style.display = 'none';

            try {
                const resp = await fetch(`${API}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, senha })
                });
                const dados = await resp.json();

                if (dados.sucesso) {
                    const usuarioLogado = {
                        idFuncionario: dados.idFuncionario,
                        nome: dados.nome,
                        cargo: dados.cargo,
                        login,
                        isAdmin: dados.isAdmin === true || dados.isAdmin === "true"
                    };
                    sessionStorage.setItem('usuarioLogado', JSON.stringify(usuarioLogado));

                    mostrarTelaModulos(usuarioLogado);
                    exibirNotificacao("Bem-vindo(a) ao sistema!");
                } else {
                    erroDiv.innerText = dados.erro || "Acesso negado! Login ou senha incorretos.";
                    erroDiv.style.display = 'block';
                }
            } catch (e) {
                erroDiv.innerText = 'Erro ao conectar com o servidor Java.';
                erroDiv.style.display = 'block';
            }
        }

        function efetuarLogout() {
            sessionStorage.removeItem('usuarioLogado');
            document.getElementById('modulosScreen').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('inputLogin').value = '';
            document.getElementById('inputSenha').value = '';
        }

        // ── SELEÇÃO DE MÓDULO ─────────────────────────────────
        function mostrarTelaModulos(usuarioLogado) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('modulosScreen').style.display = 'flex';
            document.getElementById('lblUsuario').innerText = usuarioLogado.nome;
            document.getElementById('lblCargo').innerText = usuarioLogado.cargo;

            const grid = document.getElementById('gridModulos');
            let cardsHtml = `
                <div class="modulo-card" onclick="irPara('oitivas/oitivas.html')">
                    <div class="icone"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></div>
                    <h3>Agendamento de Oitivas</h3>
                    <p>Cadastrar, listar e acompanhar oitivas em andamento.</p>
                </div>
                <div class="modulo-card" onclick="irPara('documentos/documentos.html')">
                    <div class="icone"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"></path></svg></div>
                    <h3>Controle Cartorário</h3>
                    <p>Registrar procedimentos, repassar e consultar posse.</p>
                </div>
            `;

            if (usuarioLogado.cargo === 'POLICIAL') {
                cardsHtml += `
                    <div class="modulo-card" onclick="irPara('funcionarios/funcionarios.html')">
                        <div class="icone"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" y1="8" x2="19" y2="14"></line><line x1="22" y1="11" x2="16" y2="11"></line></svg></div>
                        <h3>Cadastrar Funcionário</h3>
                        <p>Registrar novo servidor no sistema (aguarda aprovação do admin).</p>
                    </div>
                `;
            }

            if (usuarioLogado.isAdmin) {
                cardsHtml += `
                    <div class="modulo-card admin" onclick="irPara('admin/admin.html')">
                        <div class="icone"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></div>
                        <h3>Administração</h3>
                        <p>Aprovar cadastros, recusar e resetar senhas.</p>
                    </div>
                `;
            }

            grid.innerHTML = cardsHtml;
        }

        function irPara(pagina) {
            window.location.href = pagina;
        }

        // ── RESTAURA SESSÃO AO CARREGAR A PÁGINA ─────────────
        (function restaurarSessao() {
            const salvo = sessionStorage.getItem('usuarioLogado');
            if (salvo) {
                mostrarTelaModulos(JSON.parse(salvo));
            }
        })();
    </script>
</body>
</html>
